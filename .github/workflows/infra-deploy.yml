name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=infra init

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve

  test:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest tests/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          COMMIT_SHA=${{ github.sha }}
          az acr login --name vikasacr1
          docker build -t vikasacr1.azurecr.io/flask-api:${COMMIT_SHA} .
          docker push vikasacr1.azurecr.io/flask-api:${COMMIT_SHA}

      - name: Wait for RBAC propagation
        run: sleep 60

      - name: Deploy Container App
        run: |
          COMMIT_SHA=${{ github.sha }}
          az containerapp update \
            --name flaskapi-app1 \
            --resource-group WanchooResourceGroup1 \
            --image vikasacr1.azurecr.io/flask-api:${COMMIT_SHA}
