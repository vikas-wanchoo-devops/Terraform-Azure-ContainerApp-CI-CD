name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
    paths:
      - 'infra/**'
      - 'app/**'

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform -chdir=infra init

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve \
          -var="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
          -var="acr_name=${{ env.ACR_NAME }}" \
          -var="env_name=${{ env.ENV_NAME }}" \
          -var="app_name=${{ env.APP_NAME }}" \
          -var="location=\"${{ env.AZURE_LOCATION }}\""
    env:
      AZURE_LOCATION: "East US"
      RESOURCE_GROUP_NAME: "WanchooResourceGroup1"
      ACR_NAME: "vikasacr1"
      ENV_NAME: "vikas-env1"
      APP_NAME: "flaskapi-app1"

  test:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest
      - name: Run Tests
        run: pytest app/tests/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/flask-api:latest
    env:
      RESOURCE_GROUP_NAME: "WanchooResourceGroup1"
      ACR_NAME: "vikasacr1"
      APP_NAME: "flaskapi-app1"
